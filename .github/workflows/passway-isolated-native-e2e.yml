name: Passway current-source isolated native two-user E2E
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passway-isolated-native-e2e
  cancel-in-progress: false
jobs:
  isolated-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      EAS_BUILD_PROFILE: play-diagnostics
      EXPO_PUBLIC_APP_CHECK: 'off'
      EXPO_PUBLIC_DIAGNOSTICS: '1'
      EXPO_PUBLIC_OTP_PROVIDER: firebase
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
      GCLOUD_PROJECT: demo-passway
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      ENFORCE_APP_CHECK: 'false'
      MODERATION_PROVIDER: rules
      PASSWAY_RESULTS: ${{ github.workspace }}/native-results
      JAVA_TOOL_OPTIONS: -Xmx768m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: validation/architecture-source.sha256
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore trusted Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          # This workflow is manually dispatched in the owning repository; fork PRs cannot populate caches.
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Native harness unit tests
        run: python3 -m unittest discover -s harness/tests -v
      - name: Verify source and apply explicit emulator-only test overlay
        run: |
          set -eu
          sha256sum -c validation/architecture-source.sha256
          mkdir validation-source native-results
          tar -xzf validation/architecture-source.tar.gz -C validation-source
          cp validation/architecture-provenance.json native-results/source-provenance.json
          python3 harness/prepare_isolated_native.py
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Install exact SDK and regenerate native Android project
        working-directory: validation-source/passway-app
        run: |
          npm ci
          npm ci --prefix functions
          npm run typecheck
          npm run typecheck --prefix functions
          npm run build --prefix functions
          npx --no-install expo prebuild --platform android --clean --no-install
      - name: Compile fresh native release APK with local diagnostic signing
        working-directory: validation-source/passway-app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache -PreactNativeArchitectures=x86_64 --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' --stacktrace
          ./gradlew --stop
          sha256sum app/build/outputs/apk/release/*.apk > ../../../native-results/apk-sha256.txt
      - name: Start isolated Firebase services and original candidate HTTP handlers
        run: |
          set -eu
          cd validation-source/passway-app
          nohup npx --yes firebase-tools@15.32.1 emulators:start --only auth,firestore --project demo-passway > ../../native-results/firebase-emulators.log 2>&1 &
          cd ../..
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:9099/emulator/v1/projects/demo-passway/verificationCodes > /dev/null && curl --silent --output /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:9099/emulator/v1/projects/demo-passway/verificationCodes > /dev/null
          nohup node harness/isolated_api.cjs > native-results/isolated-api.log 2>&1 &
          for i in $(seq 1 20); do if curl --silent --fail http://127.0.0.1:8787/healthz; then break; fi; sleep 1; done
          curl --silent --fail http://127.0.0.1:8787/healthz
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Passway Isolated Test,O=Internal Test,C=IN'
          bash harness/probe/build_isolated.sh
      - name: Exercise current-source native UI with two isolated Android users
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: passway-isolated
          ram-size: 3072M
          heap-size: 384M
          cores: 2
          enable-hw-keyboard: false
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -skin 540x1200 -memory 3072
          pre-emulator-launch-script: python3 harness/configure_avd.py
          script: |
            adb install --no-incremental -r validation-source/passway-app/android/app/build/outputs/apk/release/app-release.apk
            adb install --no-incremental -r harness/probe/probe.apk
            adb logcat -c
            python3 harness/isolated_coordinator.py
      - name: Record exact scope and fresh success marker
        if: always()
        run: |
          echo '# Current-source isolated native two-user E2E' >> "$GITHUB_STEP_SUMMARY"
          cat validation/architecture-provenance.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Test-only emulator routing/cleartext overlay; demo-passway Auth and Firestore; original candidate HTTP handlers. No production service, SMS, attestation or physical-device proof. No live patches or implicit reruns.' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYTHON'
          import json,os,pathlib
          p=pathlib.Path('native-results')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
           for row in json.loads((p/'results.json').read_text()) if (p/'results.json').exists() else []:out.write('- '+row['status']+' '+row['test']+' — '+row.get('detail','')+'\n')
           out.write('\nNative flow PASSED\n' if (p/'complete.json').exists() and json.loads((p/'coordinator-result.json').read_text()).get('passed') else '\nNative flow NOT PASSED\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-current-native-evidence
          path: native-results
          retention-days: 3
          if-no-files-found: warn
