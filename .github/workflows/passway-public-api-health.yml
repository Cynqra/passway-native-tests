name: Public API security contract monitor
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'harness/monitoring/**'
      - '.github/workflows/passway-public-api-health.yml'
permissions:
  contents: read
concurrency:
  group: passway-public-api-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test fixed safe fixtures and failure semantics
        run: node --test harness/monitoring/public-api-monitor.test.cjs
      - name: Probe live negative attestation contract (no SMS or user mutations)
        if: github.event_name != 'pull_request'
        run: node harness/monitoring/public-api-monitor.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name != 'pull_request'
        with:
          name: public-api-security-health
          path: public-api-health.json
          retention-days: 7
          if-no-files-found: error
