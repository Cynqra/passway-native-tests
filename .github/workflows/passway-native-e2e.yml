name: Passway native Android E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/passway-native-e2e.yml'
      - 'passway-app/tests/native-ci/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passway-native-e2e
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PASSWAY_RESULTS: ${{ github.workspace }}/native-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free disk space for Android virtual device
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Require hardware acceleration
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          free -m
      - name: Materialize native test harness
        run: |
          python3 - <<'PY'
          import base64,pathlib
          root=pathlib.Path("passway-app/tests/native-ci"); root.mkdir(parents=True,exist_ok=True)
          (root/'driver.py').write_bytes(base64.b64decode(''))
          (root/'native_e2e.py').write_bytes(base64.b64decode(''))
          (root/'build-artifact-url.txt').write_bytes(base64.b64decode('aHR0cHM6Ly9leHBvLmRldi9hcnRpZmFjdHMvZWFzL3R4N0FOYmhLYUNWZVJjbVVZSkNSSlRGLTVGVlJKY25kSGtrRDVreVlHMGsuYWFi'))
          PY
      - name: Prepare exact internal build 4 APK
        run: |
          set -eu
          URL="$(cat passway-app/tests/native-ci/build-artifact-url.txt)"
          echo "::add-mask::$URL"
          curl --fail --silent --show-error --location "$URL" -o passway-v4.aab
          echo '061364fabf74c8b4433b16a85f81aa3146fc46e7f447d98224f87be302d41088  passway-v4.aab' | sha256sum -c -
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum -c -
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Passway Native CI,O=Internal Test,C=IN'
          java -Xmx512m -jar bundletool.jar build-apks --bundle=passway-v4.aab --output=passway.apks --mode=universal --ks=debug.keystore --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip passway.apks universal.apk
      - name: Native UI on two isolated Android users
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2560M
          heap-size: 384M
          disk-size: 4096M
          cores: 2
          disable-animations: false
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -skin 540x1200 -memory 2560
          script: |
            adb install -r universal.apk
            adb shell wm size 540x1200
            adb shell wm density 220
            adb shell settings put global hide_error_dialogs 0
            python3 passway-app/tests/native-ci/native_e2e.py
      - name: Write test result summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('native-results/results.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('# Native Android E2E evidence\n\n')
            f.write('Exact internal build 4 AAB, locally re-signed APK. Android 14 hardware-accelerated emulator. Two isolated native Android users, real backend, fictional Firebase OTP. This does not certify real 2Factor SMS or an Oppo physical device.\n\n')
            for r in rows:f.write('- **'+r['status']+'** '+r['test']+': '+r.get('detail','')+'\n')
            if not pathlib.Path('native-results/complete.json').exists():f.write('\n**Full E2E NOT passed. See failing step and attached evidence.**\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passway-native-e2e-evidence
          path: native-results/
          retention-days: 1
          if-no-files-found: warn
