name: Passway architecture source validation (enterprise)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: validation-source/passway-app
    env:
      CI: '1'
      EXPO_PUBLIC_OTP_PROVIDER: 2factor
      EXPO_PUBLIC_APP_CHECK: 'off'
      EXPO_PUBLIC_API_URL: https://example.invalid
      EXPO_PUBLIC_FIREBASE_WEB_API_KEY: build-only-not-a-live-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-passway.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-passway
      EXPO_PUBLIC_FIREBASE_WEB_APP_ID: '1:123456789:web:buildonly'
      EXPO_PUBLIC_FIREBASE_SENDER_ID: '123456789'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and unpack exact source snapshot
        working-directory: .
        run: |
          sha256sum -c validation/architecture-source.sha256
          mkdir validation-source
          tar -xzf validation/architecture-source.tar.gz -C validation-source
          cat validation/architecture-provenance.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            validation-source/passway-app/package-lock.json
            validation-source/passway-app/functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:mobile
      - run: npm run typecheck && npm run typecheck --prefix functions
      - run: npm test --prefix functions
      - name: Rules, transaction regressions and bounded parallel workload
        env:
          GCLOUD_PROJECT: demo-passway
          METADATA_SERVER_DETECTION: none
        run: |
          npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-passway \
            "npm run test:rules && npm run test:integration --prefix functions && node ../../harness/bounded_backend_workload.cjs"
      - run: npx --no-install expo export --platform all --output-dir dist-ci
      - name: Preserve bounded-workload measurements and scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-backend-workload
          path: validation-source/passway-app/bounded-workload-results.json
          if-no-files-found: warn
          retention-days: 3
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: validation-source/passway-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and unpack exact source snapshot
        working-directory: .
        run: |
          sha256sum -c validation/architecture-source.sha256
          mkdir validation-source
          tar -xzf validation/architecture-source.tar.gz -C validation-source
          cat validation/architecture-provenance.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Backend production dependency audit
        run: npm audit --package-lock-only --omit=dev --prefix functions --audit-level=high
      # Deliberately blocking while upstream build-tool advisories remain open.
      # Do not hide this with continue-on-error or downgrade Expo across majors.
      - name: Mobile and build-tool dependency audit
        run: npm audit --package-lock-only --audit-level=high
