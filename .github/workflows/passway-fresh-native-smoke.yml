name: Passway fresh-source Android build and cold-start smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passway-fresh-native-smoke
  cancel-in-progress: false
jobs:
  fresh-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      EAS_BUILD_PROFILE: play-diagnostics
      EXPO_PUBLIC_APP_CHECK: 'off'
      EXPO_PUBLIC_DIAGNOSTICS: '0'
      EXPO_PUBLIC_OTP_PROVIDER: 2factor
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: validation/architecture-source.sha256
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore trusted Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Native harness unit tests
        run: python3 -m unittest discover -s harness/tests -v
      - name: Verify source and generate synthetic demo-only Firebase config
        run: |
          set -eu
          sha256sum -c validation/architecture-source.sha256
          mkdir validation-source native-smoke
          tar -xzf validation/architecture-source.tar.gz -C validation-source
          cp validation/architecture-provenance.json native-smoke/source-provenance.json
          python3 - <<'PY'
          import json,pathlib
          app=pathlib.Path('validation-source/passway-app')
          config={'project_info':{'project_number':'123456789012','project_id':'demo-passway','storage_bucket':'demo-passway.firebasestorage.app'},'client':[{'client_info':{'mobilesdk_app_id':'1:123456789012:android:abcdef0123456789','android_client_info':{'package_name':'com.passway.app'}},'api_key':[{'current_key':'AIza'+'A'*35}]}],'configuration_version':'1'}
          (app/'google-services.json').write_text(json.dumps(config))
          (app/'firebase.json').write_text(json.dumps({'react-native':{'crashlytics_auto_collection_enabled':False,'analytics_auto_collection_enabled':False}}))
          PY
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Install exact SDK and regenerate native Android project
        working-directory: validation-source/passway-app
        run: |
          npm ci
          npx --no-install expo prebuild --platform android --clean --no-install
      - name: Compile fresh native release APK with local diagnostic signing
        working-directory: validation-source/passway-app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache -PreactNativeArchitectures=x86_64 --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' --stacktrace
          ./gradlew --stop
          sha256sum app/build/outputs/apk/release/*.apk > ../../../native-smoke/apk-sha256.txt
      - name: Cold-start the freshly compiled APK on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 3072
          script: |
            adb install --no-incremental -r validation-source/passway-app/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.passway.app/.MainActivity > native-smoke/launch.txt
            sleep 25
            adb shell pidof com.passway.app > native-smoke/pid.txt
            adb shell uiautomator dump /sdcard/passway-window.xml
            adb pull /sdcard/passway-window.xml native-smoke/ui.xml
            adb exec-out screencap -p > native-smoke/screen.png
            adb logcat -d > native-smoke/logcat.txt
            python3 -c "import pathlib,re; p=pathlib.Path('native-smoke'); ui=(p/'ui.xml').read_text(); logs=(p/'logcat.txt').read_text(); assert (p/'pid.txt').read_text().strip(); assert re.search(r'meet someone|your phone number|real moments',ui,re.I), 'Expected onboarding UI did not render'; assert not re.search(r'FATAL EXCEPTION|Fatal signal|ANR in com.passway.app',logs); (p/'passed.txt').write_text('Fresh native Android build and signed-out cold-start smoke passed. Synthetic demo config; no production backend or App Check attestation proof. No SMS sent.\n')"
      - name: Record honest native scope
        if: always()
        run: |
          echo '# Fresh-source Android compilation and onboarding smoke' >> "$GITHUB_STEP_SUMMARY"
          cat validation/architecture-provenance.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic demo Firebase config; unreachable API endpoint; locally diagnostic-signed APK. Not a production-signed two-user E2E or Play Integrity proof. No SMS, API deployment or billing change.' >> "$GITHUB_STEP_SUMMARY"
          test ! -f native-smoke/passed.txt || cat native-smoke/passed.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-native-smoke-evidence
          path: native-smoke
          retention-days: 3
